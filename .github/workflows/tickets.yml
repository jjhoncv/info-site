# Llama al workflow del Guardián (v0.19.1). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
name: Tickets del plan
run-name: "🎫 Tickets del plan · crea los issues desde plan/tareas.json"

on:
  push:
    branches: [main]
    paths: [plan/tareas.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tickets:
    uses: jjhoncv/guardian/.github/workflows/guardian-tickets.yml@v0.20.2
