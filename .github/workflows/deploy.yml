# Llama al workflow del Guardián (v0.19.1). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
name: Deploy
run-name: "${{ github.event_name == 'push' && '🚀 Staging · migraciones y publicación de main' || format('🚀 Preview · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: jjhoncv/guardian/.github/workflows/guardian-deploy.yml@v0.20.2
    with:
      base_de_datos: mysql
    secrets: inherit
