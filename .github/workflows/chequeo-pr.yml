# Llama al workflow del Guardián (v0.19.1). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
name: Chequeo del PR
run-name: "✅ Chequeo (ticket y escenario) · PR #${{ github.event.pull_request.number }} · ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  chequeo:
    uses: jjhoncv/guardian/.github/workflows/guardian-chequeo-pr.yml@v0.22.0
