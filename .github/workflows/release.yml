# Llama al workflow del Guardián (v0.19.1). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
name: Release
run-name: "🏷️ Release · versión y producción (aprobación del dueño)"

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  release:
    uses: jjhoncv/guardian/.github/workflows/guardian-release.yml@v0.21.0
    with:
      base_de_datos: mysql
    secrets: inherit
