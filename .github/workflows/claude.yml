# Llama al workflow del Guardián (v0.19.1). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
# Claude en la nube (ADR 0024 del Guardián): «@claude» del dueño en un ticket → PR; al fusionar un PR, Claude
# toma solo el siguiente ticket de la fase; al cerrar el dueño una fase (milestone), el primero de la siguiente (máximo 2 PRs suyos esperando revisión).
name: Claude
run-name: "${{ github.event_name == 'milestone' && '🤖 Claude · primer ticket de la fase siguiente' || github.event_name == 'pull_request' && format('🤖 Claude · siguiente ticket (tras el PR #{0})', github.event.pull_request.number) || (contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner) && format('🤖 Claude · @claude en #{0}', github.event.issue.number) || format('💤 Claude · comentario en #{0} (ignorado)', github.event.issue.number) }}"

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
    branches: [main]
  milestone:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Candado: las sesiones de «siguiente ticket» (merge o cierre de fase) van de a una, así dos no toman el mismo
# ticket (Info Site #39 y #42). Un @claude del dueño no espera: cada comentario va en su propio grupo.
concurrency:
  group: ${{ github.event_name == 'issue_comment' && format('claude-comentario-{0}', github.run_id) || 'claude-siguiente' }}
  cancel-in-progress: false

jobs:
  claude:
    uses: jjhoncv/guardian/.github/workflows/guardian-claude.yml@v0.21.0
    with:
      base_de_datos: mysql
    secrets: inherit
