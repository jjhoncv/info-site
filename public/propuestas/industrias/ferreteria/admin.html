<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Ferretería (demo)</title><link rel="stylesheet" href="estilo.css"></head><body>
<div class="app"><aside class="side"><a class="logo" href="index.html"><b>El</b>Tornillo</a><a class="i on" href="admin.html">Productos</a><a class="i" href="#">Categorías</a><a class="i" href="#">Cotizaciones</a><a class="i" href="index.html">Ver sitio ↗</a></aside>
<main class="main"><h1>Productos</h1>
<div class="bar"><input type="search" placeholder="Buscar por nombre o código…" aria-label="Buscar" style="padding:10px;border:1px solid #bdbdb6;min-width:240px"><select aria-label="Stock" style="padding:10px;border:1px solid #bdbdb6"><option>Todo el stock</option><option>Stock bajo</option><option>Agotados</option></select></div>
<table><thead><tr><th>Código</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Estado</th></tr></thead><tbody>
<tr><td>HE-0231</td><td>Taladro 650 W</td><td>S/ 189</td><td>24</td><td><span class="tag">En stock</span></td></tr>
<tr><td>PI-0114</td><td>Pintura látex 4 L</td><td>S/ 72</td><td>3</td><td><span class="tag low">Stock bajo</span></td></tr>
<tr><td>GA-0045</td><td>Llave stillson 14"</td><td>S/ 54</td><td>2</td><td><span class="tag low">Stock bajo</span></td></tr>
<tr><td>EL-0999</td><td>Foco LED 12 W</td><td>S/ 7</td><td>0</td><td><span class="tag out">Agotado</span></td></tr></tbody></table>
<form id="f" novalidate><label>Código<input id="c" placeholder="HE-0000"><span class="msg" id="ec"></span></label>
<label>Nombre<input id="n" placeholder="Ej. Destornillador Phillips"><span class="msg" id="en"></span></label>
<label>Precio (S/)<input id="p" inputmode="decimal" placeholder="0.00"><span class="msg" id="ep"></span></label>
<label>Stock<input id="s" inputmode="numeric" placeholder="0"><span class="msg" id="es"></span></label>
<button class="btn" type="submit">Guardar producto</button><span class="ok" id="ok"></span></form>
</main></div>
<script>
f.onsubmit=function(e){e.preventDefault();var a=!/^[A-Z]{2}-\d{4}$/.test(c.value),b=!n.value.trim(),d=!(parseFloat(p.value)>0),g=!(/^\d+$/.test(s.value));ec.textContent=a?"Formato: dos letras, guion y 4 números (HE-0231)":"";en.textContent=b?"El nombre es obligatorio":"";ep.textContent=d?"Escribe un precio mayor a 0":"";es.textContent=g?"Escribe un número entero (0 o más)":"";c.className=a?"err":"";n.className=b?"err":"";p.className=d?"err":"";s.className=g?"err":"";ok.textContent=a||b||d||g?"":"Guardado (demo, no se envía nada)"}
</script></body></html>
