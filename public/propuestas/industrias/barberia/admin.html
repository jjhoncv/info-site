<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Barbería (demo)</title><link rel="stylesheet" href="estilo.css"></head><body>
<div class="app"><aside class="side"><a class="logo" href="index.html">Don Filo</a><a class="i on" href="admin.html">Servicios</a><a class="i" href="#">Equipo</a><a class="i" href="#">Fotos</a><a class="i" href="index.html">Ver sitio ↗</a></aside>
<main class="main"><h1>Servicios</h1>
<table><thead><tr><th>Servicio</th><th>Duración</th><th>Precio</th><th>Estado</th></tr></thead><tbody>
<tr><td>Corte clásico</td><td>45 min</td><td>S/ 25</td><td><span class="tag on">Visible</span></td></tr>
<tr><td>Fade y diseño</td><td>50 min</td><td>S/ 30</td><td><span class="tag on">Visible</span></td></tr>
<tr><td>Barba perfilada</td><td>30 min</td><td>S/ 18</td><td><span class="tag on">Visible</span></td></tr>
<tr><td>Tinte de barba</td><td>40 min</td><td>S/ 35</td><td><span class="tag">Oculto</span></td></tr></tbody></table>
<form id="f" novalidate><label>Nombre<input id="n" placeholder="Ej. Corte + cejas"><span class="msg" id="en"></span></label>
<label>Duración (min)<input id="m" inputmode="numeric" placeholder="30"><span class="msg" id="em"></span></label>
<label>Precio (S/)<input id="p" inputmode="decimal" placeholder="0.00"><span class="msg" id="ep"></span></label>
<button class="btn" type="submit">Guardar servicio</button><span class="ok" id="ok"></span></form>
</main></div>
<script>
f.onsubmit=function(e){e.preventDefault();var a=!n.value.trim(),b=!(parseInt(m.value)>0),c=!(parseFloat(p.value)>0);en.textContent=a?"El nombre es obligatorio":"";em.textContent=b?"Indica los minutos":"";ep.textContent=c?"Escribe un precio mayor a 0":"";n.className=a?"err":"";m.className=b?"err":"";p.className=c?"err":"";ok.textContent=a||b||c?"":"Guardado (demo, no se envía nada)"}
</script></body></html>
