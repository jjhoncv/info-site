<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">

<main class="main"><h1>Noticias</h1>

<script>
f.onsubmit=function(e){e.preventDefault();var a=!n.value.trim(),b=!d.value;en.textContent=a?"El título es obligatorio":"";ed.textContent=b?"Elige una fecha":"";n.className=a?"err":"";d.className=b?"err":"";ok.textContent=a||b?"":"Publicada (demo, no se envía nada)"}
</script></body></html>
