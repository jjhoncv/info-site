<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar · Admin (C · Minimal cálido)</title><link rel="stylesheet" href="estilo.css"></head><body>
<main class="login"><form id="f" novalidate>
<a class="logo" href="index.html">Info Site</a>
<h1>Hola de nuevo</h1><p class="ayuda" style="margin-bottom:24px">Ingresa para editar tu sitio.</p>
<div class="campo" id="cu"><label for="u">Usuario</label><input id="u" value="demo" autocomplete="username"><p class="msg">Escribe tu usuario.</p></div>
<div class="campo" id="cp"><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password"><p class="msg">La contraseña es obligatoria.</p></div>
<button class="btn" type="submit">Ingresar</button>
<p class="dem">Demo pública · usuario <b>demo</b> · 5 intentos y se bloquea 10 minutos.</p></form></main>
<script>
document.getElementById('f').onsubmit=function(e){e.preventDefault();var ok=true;
[['u','cu'],['p','cp']].forEach(function(x){var v=document.getElementById(x[0]).value.trim();document.getElementById(x[1]).classList.toggle('err',!v);if(!v)ok=false});
if(ok)location.href='admin-dashboard.html'};
</script></body></html>
